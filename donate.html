<script>
  /* 认证门：未登录/未实名 → 强制跳注册；未成年账号 → 阻断支付 */
  document.addEventListener("DOMContentLoaded", () => {
    const strip = document.getElementById("authStrip");
    if (window.AUTH && AUTH.isVerified()) {
      if (AUTH.isMinor()) {
        AUTH.gate({ blockMinor: true });
      } else {
        strip.hidden = false;
        AUTH.paintCta();
      }
    } else if (window.AUTH) {
      AUTH.gate({});
    }
  });
</script>
